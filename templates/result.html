<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Results — MRI Tumor Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">← Back</a>
        <span class="navbar-text">MRI Tumor Detector</span>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-body text-center">
              <h4 class="card-title">Top Prediction</h4>
              <img src="{{ url_for('uploaded_file', filename=filename) }}" class="result-img my-3" alt="Uploaded MRI">
              <h5 class="fw-bold">{{ top_label }}</h5>
              <p class="text-muted">{{ top_confidence }}</p>
            </div>
          </div>

          <div class="card">
            <div class="card-header">All Class Probabilities</div>
            <ul class="list-group list-group-flush">
              {% for pred in predictions %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  {{ pred.label }}
                  <span class="badge bg-primary rounded-pill">{{ pred.confidence }}</span>
                </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
